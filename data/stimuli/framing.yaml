# Gain-loss framing ("Asian disease problem"; Tversky & Kahneman, 1981) as used in Many Labs 1.
# The original variant uses the 1981 wording. Exact ML1 wording remains unverified.
# Counterbalancing assigns A or B to {label}.
response_instruction: >-
  Answer as yourself in this situation. You may explain briefly, then end your reply with a
  final line in exactly this format: CHOICE: A or CHOICE: B

variants:
  original:
    source: "Tversky & Kahneman (1981); Many Labs 1 (Klein et al., 2014) - VERIFY wording"
    preamble: >-
      Imagine that the U.S. is preparing for the outbreak of an unusual disease, which is
      expected to kill 600 people. Two alternative programs to combat the disease have been
      proposed. Assume that the exact scientific estimates of the consequences of the programs
      are as follows:
    question: Which of the two programs would you favor?
    conditions:
      gain:
        certain: "If Program {label} is adopted, 200 people will be saved."
        risky: "If Program {label} is adopted, there is a 1/3 probability that 600 people will be saved, and a 2/3 probability that no people will be saved."
      loss:
        certain: "If Program {label} is adopted, 400 people will die."
        risky: "If Program {label} is adopted, there is a 1/3 probability that nobody will die, and a 2/3 probability that 600 people will die."

  para1:
    source: "Author paraphrase (sensitivity), numbers and structure preserved"
    preamble: >-
      Suppose health officials in the United States expect a new and unusual illness to break
      out, and without action it is predicted to kill 600 people. Officials are choosing between
      two response plans. The best scientific estimates of what each plan would do are:
    question: Which plan would you support?
    conditions:
      gain:
        certain: "Program {label}: 200 people will definitely be saved."
        risky: "Program {label}: there is a one-in-three chance that all 600 people will be saved and a two-in-three chance that nobody will be saved."
      loss:
        certain: "Program {label}: 400 people will definitely die."
        risky: "Program {label}: there is a one-in-three chance that no one will die and a two-in-three chance that all 600 people will die."

  para2:
    source: "Author paraphrase (sensitivity), numbers and structure preserved"
    preamble: >-
      A rare disease is about to reach the country. Experts project that it will cause 600
      deaths if nothing is done. You are asked to pick one of two programs. According to the
      most precise estimates available, the outcomes would be:
    question: Which program do you prefer?
    conditions:
      gain:
        certain: "With Program {label}, 200 of the 600 people are saved for sure."
        risky: "With Program {label}, there is a 1 in 3 chance of saving all 600 people and a 2 in 3 chance of saving none of them."
      loss:
        certain: "With Program {label}, 400 of the 600 people die for sure."
        risky: "With Program {label}, there is a 1 in 3 chance that none of the 600 people die and a 2 in 3 chance that all 600 die."

# Design-aware variant (separately identified arms with design_disclosure: true). Describes the
# random assignment and what is held constant. Never the observed results or expected effect.
design_disclosure: >-
  How this study works: each participant is randomly assigned to read one of two versions of
  the same decision problem. In both versions the disease, the 600 people at risk, and the
  actual consequences of the two programs are identical. The versions differ only in whether
  the programs' outcomes are described in terms of people who will be saved or people who will
  die. You are reading one of the two versions.

# Forecast methods. {materials} is the decision problem exactly as participants in the condition
# see it (after counterbalancing); {labels} are the option letters. No results appear here.
forecast:
  population_system: >-
    You forecast the results of behavioral experiments. Give your best calibrated estimate of
    how the stated population actually responds.
  population_prompt: |
    Target population: {target_population}

    Each participant in this experimental condition read the following and chose one option:

    ---
    {materials}
    ---

    Estimate the proportion of the target population who would choose each option. Reply with a
    JSON object with keys {labels} whose values are proportions between 0 and 1 that sum to 1.
  persona_system: >-
    You forecast how specific people respond in behavioral experiments. Give your best
    calibrated probability estimate for the person described.
  persona_prompt: |
    {persona}

    This person read the following and chose one option:

    ---
    {materials}
    ---

    Estimate the probability that this person would choose each option. Reply with a JSON object
    with keys {labels} whose values are probabilities between 0 and 1 that sum to 1.
