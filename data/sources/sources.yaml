    sha256: 9e9dc57dd550c671da6dfc06affabe39aa011faad46ab9b00415c9660b6ae99f
    bytes: 517278
    format: pdf
    reproducibility: >-
      Appendix pages 18-19 give the full texts of scenario 3 (Ned) and scenario 4 (Oscar) with
      the question "Is it morally permissible for <name> to throw the switch?". The 2007
      study excluded control-scenario failures and responses under 4 seconds.
    discrepancies:
      - >-
        ML2 condition names (GreaterGood / SideEffect) are matched to scenarios 3 / 4 by the
        consistent ML2 item numbering (Trolley 1: haus1 = scenario 1 Denise = SideEffect,
        haus2 = scenario 2 Frank = GreaterGood; Trolley 2: haus3 = Ned, haus4 = Oscar) and by
        the means / side-effect structure; ML2's own materials were not available to confirm.
    unknowns: []
    sealed: false

