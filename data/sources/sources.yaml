    # The project brief quotes the published whole-percent permissibility rates. They are kept
    # here only as a hash commitment (sha256 of "silicon-subjects/claim/v1|side_effect=<pct>|
    # greater_good=<pct>"), so they cannot be read casually. This guards against accidental
    # exposure only: a two-number claim is trivially recoverable by brute force.
    published_claims:
      - description: whole-percent permissible rates per condition quoted in the project brief for Klein et al. (2018)
        sha256: 57db725736b9e462e21704b728aa17bef132cbdc412d2ff9d12bd26c75b2e21c

