  - id: hauser2007_paper
    title: Hauser, Cushman, Young, Jin & Mikhail (2007), Mind & Language
    role: original stimuli (Appendix, scenarios 3 and 4) and original design
    task: holdout
    citation: >-
      Hauser, M., Cushman, F., Young, L., Kang-Xing Jin, R., & Mikhail, J. (2007). A dissociation
      between moral judgments and justifications. Mind & Language, 22, 1-21. (Volume and pages
      as cited in the ML2 analysis code; DOI not recorded because no source in hand states it.)
    url: https://moralitylab.bc.edu/wp-content/uploads/sites/192/2011/10/mind_lang_2007.pdf
    release: author-hosted PDF (Boston College Morality Lab)
    license: publisher copyright; not redistributed here (stimulus text quoted for research use)
    redistributable: false
