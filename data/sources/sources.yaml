# Committed derived files. Each is reproducible from a verified source by `sim sources extract`.
extracts:
  - id: ml1_framing_extract
    from: ml1_cleaned
    path: data/sources/extracts/ml1_framing.csv
    columns: [session_id, referrer, sample, us_or_international, lab_or_online, gainlossgroup, gainlossDV, diseaseframinga, diseaseframingb, mturk.exclude, mturk.exclude.null]
    note: >-
      CC0 subset of ml1_cleaned with only the framing-related columns, so tests and imports run
      without the 36 MB raw file. Values are whitespace-trimmed; nothing else is changed.

# Committed benchmark files that `sim sources verify` re-imports from their source and compares
# byte for byte (the importer output has no timestamp, so this is exact).
benchmarks:
  - task: framing
    source: ml1_cleaned
    spec: data/benchmarks/import_specs/manylabs1_framing.yaml
    out: data/benchmarks/framing_manylabs1.yaml
  # Sealed (evaluation) benchmarks: the files are gitignored and rebuilt locally with
  # `sim sources fetch` + `sim sources extract`; only their SHA-256 is committed, so nothing
  # that reads the repository can see the hold-out outcomes.
  - task: holdout
    source: ml2_hauser4_clean
    spec: data/benchmarks/import_specs/manylabs2_hauser4.yaml
    out: data/benchmarks/holdout_hauser4.yaml
    sealed: true
    sha256: 9736c082003907810176c54fccff28ac0f41d5c1cbbf97df01a2324ab8d66942
  - task: holdout
    source: ml2_hauser4_clean
    spec: data/benchmarks/import_specs/manylabs2_hauser4_4s.yaml
    out: data/benchmarks/holdout_hauser4_4s.yaml
    sealed: true
    sha256: ca6af5419af3db2903d891da89d786e13983a3b5b242525ddcce3acfd0b0aea1
