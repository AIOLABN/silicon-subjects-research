# Declared provenance of every external research source.
#
# This file is written by hand from the sources themselves (codebooks, papers, analysis code).
# `sim sources audit` combines it with what is observed in the files under data/raw/ (hash,
# size, rows, columns, missingness, cross-checks) and writes data/sources/provenance.json.
# `sim sources verify` recomputes everything and fails on any difference.
#
# Rules: a mapping is recorded here only if a source states it or a check below verifies it.
# Anything else is listed under `unknowns`. Disagreements between sources go under
# `discrepancies` and are never resolved by editing a human benchmark.
#
# Sealing: sources with `sealed: true` hold outcomes of an evaluation (hold-out) study. Their
# outcome columns are profiled for missingness only, and checks on them report pass/fail
# without values.

schema: silicon-subjects/sources/v1

sources:
  # ------------------------------------------------------------------ Many Labs 1: framing
  - id: ml1_cleaned
    title: Many Labs 1 cleaned dataset with variable values (tab-delimited)
    role: primary participant-level data for the framing benchmark
    task: framing
    citation: >-
      Klein, R. A., Ratliff, K. A., Vianello, M., Adams, R. B., Jr., Bahník, Š., Bernstein, M. J.,
      ... Nosek, B. A. (2014). Investigating variation in replicability: A "many labs" replication
      project. Social Psychology, 45(3), 142-152. https://doi.org/10.1027/1864-9335/a000178
    url: https://raw.githubusercontent.com/ManyLabsOpenScience/ManyLabs1/7a1334c053201ccdd2054417f74aa3d62776dd03/Data/Tab.delimited.Cleaned.dataset.WITH.variable.values.dat
    release: >-
      GitHub ManyLabsOpenScience/ManyLabs1 at commit 7a1334c (2018-11-19), file
      Data/Tab.delimited.Cleaned.dataset.WITH.variable.values.dat; mirrors OSF project wx7ck.
      Byte-identical copy in FredHasselman/manylabRs (commit 829078f).
    license: CC0 1.0 (Data/Data released under CC0 license.txt)
    redistributable: true
    path: data/raw/ml1/ManyLabs1_Cleaned_VariableValues.tsv
    sha256: d07e664c137c514981ccd9abae96d24469867a37e9a93fe695a734e475fc3f05
    bytes: 36072878
    format: tsv
    encoding: utf-8
    encoding_errors: replace
    variables_needed:
      session_id: unique participant session id (row identifier)
      referrer: data-collection site (36 sites); full names in OSF Table S1
      sample: numeric site code, one-to-one with referrer
      gainlossgroup: "assigned frame: 1 = gain wording (item diseaseframinga), 0 = loss wording (item diseaseframingb)"
      gainlossDV: "choice: 1 = program with exact (sure) outcome, 2 = probabilistic (risky) program; blank = no response"
      diseaseframinga: raw gain-frame item (1 = "200 people will be saved", 2 = risky)
      diseaseframingb: raw loss-frame item (1 = "400 people will die", 2 = risky)
      us_or_international: "0 = US sample, 1 = international sample"
      lab_or_online: "0 = in-lab, 1 = online"
      mturk.exclude: '"Recommended to exclude by Jesse" (codebook); rationale undocumented'
      mturk.exclude.null: '"Excludes responses that completed zero mini-experiments" (codebook)'
    treatment_arms:
      gain: gainlossgroup == 1 (participant answered diseaseframinga)
      loss: gainlossgroup == 0 (participant answered diseaseframingb)
    outcome_coding:
      chose_certain: gainlossDV == 1 (success); gainlossDV == 2 is the risky program (failure)
    wording: >-
      Codebook stem (both frames): "Imagine that the United States is preparing for the outbreak
      of an unusual disease, which is expected to kill 600 people. Two alternative programs to
      fight the disease have been proposed. Choose program:". Options are given only as value-label
      summaries (gain: "200 people will be saved" / "1/3 probability to save all, 2/3 nobody will
      be saved"; loss: "400 people will die" / "1/3 probability nobody will die, 2/3 that 600 will
      die"). Non-English sites used translations not included in this file.
    reproducibility: >-
      Reproduced. Frame and choice codes agree row-for-row with the raw items; frame sizes match
      the Berkeley extract exactly; all 36 sites x 5 cells match the ML1 analysts' own Gain_Loss
      sheet (MLforR.xlsx).
    discrepancies:
      - >-
        Mixed text encoding: 297 of 6,346 physical lines contain bytes that are not valid UTF-8
        (all in free-text columns). The file is read as UTF-8 with replacement characters; the
        audit checks that no column used here contains a replacement character.
      - >-
        Codebook value labels for gainlossgroup and gainlossDV are truncated inside the xlsx
        itself ("{,00, People will die}...", "{1,00, chose program with exact outcome}..."). The
        mapping is established from the raw items diseaseframinga/b and the check
        ml1_codebook_items, and is consistent with these truncated labels.
      - >-
        mturk.exclude (3 rows, values 2 and 99) and mturk.exclude.null (20 rows, value 1) flag 23
        rows. All 23 answered the framing item, which contradicts the description "completed
        zero mini-experiments" for mturk.exclude.null. Neither the ML1 analysts' Gain_Loss sheet
        nor the Berkeley extract excludes them, so the published analysis set keeps them. The
        import keeps them and reports the flags (decision recorded in the import spec).
      - >-
        The stimulus wording in the ML1 codebook ("to fight the disease ... Choose program:")
        differs from Tversky & Kahneman (1981) ("to combat the disease ... Assume that the exact
        scientific estimates ... Which of the two programs would you favor?").
    unknowns:
      - Exact full option texts shown to ML1 participants (only abbreviated value labels here).
      - Translations used at non-English sites and which sites used them.
    sealed: false

