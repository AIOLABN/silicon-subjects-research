  # ------------------------------------------------------- Many Labs 2 Hauser.4: hold-out
  - id: ml2_hauser4_clean
    title: Many Labs 2, Trolley Dilemma 2 (Hauser et al., 2007), analysis Hauser.4, global CLEAN_CASE data
    role: participant-level data for the hold-out (evaluation) benchmark
    task: holdout
    citation: >-
      Klein, R. A., Vianello, M., Hasselman, F., Adams, B. G., Adams, R. B., Jr., Alper, S., ...
      Nosek, B. A. (2018). Many Labs 2: Investigating variation in replicability across samples
      and settings. Advances in Methods and Practices in Psychological Science, 1(4), 443-490.
      https://doi.org/10.1177/2515245918810225
    url: https://raw.githubusercontent.com/ManyLabsOpenScience/ManyLabs2/acef63fc397b8dce7f0b00f863bcea78d324bea8/OSFdata/Trolley%20Dilemma%202%20(Hauser%20et%20al.%2C%202007)/Hauser.4/Global/Data/Hauser_4_study_global_include_all_CLEAN_CASE.csv
    release: >-
      GitHub ManyLabsOpenScience/ManyLabs2 at commit acef63f, OSFdata/Trolley Dilemma 2 (Hauser
      et al., 2007)/Hauser.4/Global/Data/ (mirrors OSF project 8cd4r).
    license: repository GPL-3.0 (code); data published openly on OSF; not redistributed here
    redistributable: false
    path: data/raw/ml2_hauser4/Hauser4_ManyLabs2_CLEAN_CASE.csv
    sha256: a5a83b98cba009ee462afa1ed5c3d34395da143a3a1f8d78bf4d7ce45e012f90
    bytes: null
    format: csv
    variables_needed:
      uID: unique participant id
      factor: "condition: GreaterGood (item haus3.1) or SideEffect (item haus4.1)"
      variable: "response: Yes / No (= raw code 1 / 2 of the condition's item)"
      haus3.1: "GreaterGood item, 1 = Yes (permissible), 2 = No"
      haus4.1: "SideEffect item, 1 = Yes (permissible), 2 = No"
      haus3.1t_3: GreaterGood page-submit time (s)
      haus4.1t_3: SideEffect page-submit time (s)
      source: data-collection site (61 sites)
      Language: survey language (12 languages)
      Weird: WEIRD-sample indicator
      case.include: ML2 inclusion flag (TRUE for every row in this file)
    outcome_columns: [variable, haus3.1, haus4.1]
    treatment_arms:
      greater_good: factor == GreaterGood (Hauser 2007 scenario 3, "Ned"; harm as an intended means)
      side_effect: factor == SideEffect (Hauser 2007 scenario 4, "Oscar"; harm as a foreseen side effect)
    outcome_coding:
      judged_permissible: variable == Yes (success); No is failure
    exclusions: >-
      ML2 key table (unique.id 47) intends "Timing > 4" seconds but the entry is malformed
      (c('Timing > 4') instead of c('Timing', 'X > 4')); the published results report 0 excluded
      cases, and 100 rows have a page time under 4 s. No prior-exposure filter in Hauser.4
      (that is Hauser.5/6).
    reproducibility: >-
      Reproduced (sealed check ml2_hauser4_results): N = 7,923, per-condition n, and Yes/No
      counts equal the published RESULTS file; the condition mapping and Yes/No coding agree
      with the raw items for every row.
    discrepancies:
      - >-
        The preregistered analysis plan (manylabRs varfun.Hauser.1 documentation) excludes
        participants who took fewer than 4 seconds; the published Hauser.4 analysis did not
        apply it (malformed key-table filter). The benchmark follows the published analysis
        (N = 7,923); the 4-second rule is available as a sealed sensitivity import.
      - >-
        The key table requests a one-sided test (alternative = 'greater'); the published RESULTS
        file reports a two-sided Fisher exact test.
      - >-
        In the RESULTS file, stat.cond3.n and stat.cond4.n (GreaterGood rows) show 3,955 (the
        SideEffect n); stat.n2 = 3,968 is correct and the GreaterGood proportions use 3,968.
      - >-
        manylabRs varfun.Hauser.2 (not used by Hauser.4) pairs SideEffect with haus3.1 in its
        code while its documentation pairs haus3.1 with GreaterGood. Hauser.4 uses
        varfun.Hauser.1 with the key-table mapping SideEffect = haus4.1, GreaterGood = haus3.1,
        which the data confirm.
    unknowns:
      - Exact English wording presented by ML2 (ML2 materials not in hand); the 2007 Appendix text is used.
      - Translations used at the 11 non-English language sites.
    sealed: true

