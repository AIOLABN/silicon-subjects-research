[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "silicon-subjects"
version = "0.1.0"
description = "An experiment testing whether AI makes the same choices people did in behavioural studies."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Adham Mater" }]
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "httpx>=0.27",
  "tabulate>=0.9",
]

[project.optional-dependencies]
anthropic = ["anthropic>=2.0"]
sources = ["openpyxl>=3.1", "pypdf>=4.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-xdist>=3.5", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
sim = "silicon_subjects.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/silicon_subjects"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
