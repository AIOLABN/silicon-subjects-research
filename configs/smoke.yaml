study_id: smoke-live
seed: 20261012

models:
  # Training cutoffs from Anthropic's model documentation (month precision).
  - id: opus55
    provider: anthropic
    model: claude-opus-5-5
    max_tokens: 16000
    effort: medium
    training_cutoff: "2026-06"
  - id: sonnet55
    provider: anthropic
    model: claude-sonnet-5-5
    max_tokens: 16000
    effort: medium
    training_cutoff: "2026-06"
  # A model from another developer, so agreement between models is not one developer's training
  # and safety tuning twice. The pilot checks that it accepts `seed` and strict JSON-schema
  # output on Chat Completions. Its reasoning effort is OpenAI's default (`effort` is sent only
  # to Claude models).
  - id: gpt61sol
    provider: openai_compatible
    base_url: https://api.openai.com/v1
    model: gpt-6.1-sol
    api_key_env: OPENAI_API_KEY
    max_tokens: 16000
    max_tokens_param: max_completion_tokens
    price_usd_per_mtok: [2.0, 10.0]   # standard API pricing, input, output
    training_cutoff: "2026-04-30"

tasks:
  - id: framing
    split: development
    exposure: >-
      The Many Labs 1 framing materials and published effect direction were known while the prompts and paraphrases were written. Human counts have since been imported and cross-checked.
    kind: framing
    stimuli: data/stimuli/framing.yaml
    benchmark: data/benchmarks/framing_manylabs1.yaml
    counterbalance_option_order: true
    materials_first_public: "1981-01-30"
    confirmatory_test: false
  - id: obedience
    split: development
    exposure: >-
      Burger's (2009) published percentages (70.0% base, 63.3% modeled refusal) informed the design: the 150-volt endpoint, the second condition and the power analysis. Not untouched.
    kind: obedience
    stimuli: data/stimuli/obedience.yaml
    benchmark: data/benchmarks/obedience_burger2009.yaml
    materials_first_public: "2009-01-01"
    forecast_extension: true
  - id: holdout
    split: evaluation
    exposure: >-
      See configs/study.yaml (Many Labs 2 Hauser.4). Disabled in the smoke test so a live smoke run never touches the sealed hold-out.
    kind: vignette
    stimuli: data/stimuli/trolley_hauser2007.yaml
    benchmark: data/benchmarks/holdout_hauser4.yaml
    counterbalance_option_order: true
    enabled: false
    materials_first_public: "2007-01-01"

personas:
  n_profiles: 50
  file: data/personas/profiles_v1.jsonl
  attributes:
    - name: age
      levels: {"18-29 years old": 0.20, "30-44 years old": 0.26, "45-64 years old": 0.33, "65 or older": 0.21}
    - name: gender
      levels: {woman: 0.51, man: 0.49}
    - name: education
      levels: {"high school or less": 0.37, "some college or associate degree": 0.25, "bachelor's degree": 0.23, "graduate degree": 0.15}
    - name: race_ethnicity
      levels: {White: 0.59, "Hispanic or Latino": 0.19, Black: 0.12, Asian: 0.06, "multiracial or other": 0.04}
    - name: region_of_the_US
      levels: {Northeast: 0.17, Midwest: 0.21, South: 0.38, West: 0.24}

# The pilot runs one or two trials of every kind the study runs, so `sim estimate --from-run`
# can replace the assumed tokens with measured ones (the hold-out stays switched off).
arms:
  - id: baseline
    persona: false
    n_per_cell: 1
    role: primary
  - id: persona
    persona: true
    replicates_per_profile: 1
    profiles_limit: 2
    tasks: [framing]
    role: secondary
  - id: population_forecast
    method: population_forecast
    persona: false
    n_per_cell: 1
    tasks: [framing, obedience]
    role: secondary
  - id: persona_forecast
    method: persona_forecast
    persona: true
    replicates_per_profile: 1
    profiles_limit: 2
    tasks: [framing]
    role: secondary

analysis:
  alpha: 0.05
  margin_proportion: 0.10
  margin_cohens_h: 0.20
  margin_smd: 0.20
  multiple_comparisons: holm
  bootstrap_iterations: 5000

runner:
  concurrency: 8
  max_attempts: 6
  request_timeout_s: 600
